# Push a v<version> tag to build and publish this fork on GitHub Releases.
# workflow_dispatch builds the packages without publishing or enabling updates.
# See docs/release.md for the signing key and optional Apple credentials.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SHELLRS_RELEASE_PUBLIC_KEY: ${{ vars.SHELLRS_UPDATE_PUBLIC_KEY }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version and channel
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          python3 - "$version" <<'PY_VERSION'
          import re, sys
          core = r"(?:0|[1-9][0-9]*)"
          if not re.fullmatch(rf"{core}\.{core}\.{core}(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", sys.argv[1]):
              sys.exit("Cargo.toml must have a SemVer release or prerelease version without build metadata")
          for identifier in sys.argv[1].partition("-")[2].split("."):
              if identifier.isdigit() and len(identifier) > 1 and identifier.startswith("0"):
                  sys.exit("Numeric prerelease identifiers must not start with zero")
          PY_VERSION
          channel=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Require the fork update key pair
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          HAS_PRIVATE_KEY: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          if [ "$HAS_PRIVATE_KEY" != true ]; then
            echo "::error::Set the MINISIGN_SECRET_KEY repository secret"
            exit 1
          fi
          python3 - <<'PY_KEY'
          import base64, binascii, os, sys
          try:
              key = base64.b64decode(os.environ["SHELLRS_RELEASE_PUBLIC_KEY"], validate=True)
          except (KeyError, binascii.Error):
              key = b""
          if len(key) != 42 or not key.startswith(b"Ed"):
              sys.exit("Set the SHELLRS_UPDATE_PUBLIC_KEY repository variable to line 2 of the fork's minisign .pub file")
          PY_KEY
      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version=$VERSION
          section() {
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$1" | sed -e '/./,$!d'
          }
          for changelog in CHANGELOG.md CHANGELOG.zh.md; do
            if [ -z "$(section "$changelog")" ]; then
              echo "::error::$changelog has no section ## [$version]"
              exit 1
            fi
          done
          section CHANGELOG.md > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: notes
          path: notes.md

  macos:
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
      SHELLRS_APPLE_TEAM_ID: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add "$ARCH-apple-darwin"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - name: Build the architecture-specific app
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs --target "$ARCH-apple-darwin"
          mkdir -p dist build
          lipo "target/$ARCH-apple-darwin/release/shellrs" -verify_arch "${ARCH/aarch64/arm64}"
          packaging/macos/bundle.sh "target/$ARCH-apple-darwin/release/shellrs" "$VERSION" "$GITHUB_RUN_NUMBER" build
      - name: Sign and package macOS
        env:
          CERTIFICATE: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CERTIFICATE_PASSWORD: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          IDENTITY: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          API_KEY: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_API_KEY_P8 || '' }}
          API_KEY_ID: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_API_KEY_ID || '' }}
          API_ISSUER: ${{ needs.verify.outputs.channel != '' && secrets.APPLE_API_ISSUER || '' }}
        run: |
          developer_id=false
          if [ -n "$CERTIFICATE$CERTIFICATE_PASSWORD$IDENTITY$SHELLRS_APPLE_TEAM_ID$API_KEY$API_KEY_ID$API_ISSUER" ]; then
            for setting in CERTIFICATE CERTIFICATE_PASSWORD IDENTITY SHELLRS_APPLE_TEAM_ID API_KEY API_KEY_ID API_ISSUER; do
              if [ -z "${!setting}" ]; then
                echo "::error::Incomplete Apple signing configuration: missing $setting"
                exit 1
              fi
            done
            developer_id=true
          fi
          if $developer_id; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password=$(uuidgen)
            echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            codesign --force --timestamp --options runtime --sign "$IDENTITY" build/ShellRS.app
            codesign -d --verbose=4 build/ShellRS.app 2>&1 | grep -Fx "TeamIdentifier=$SHELLRS_APPLE_TEAM_ID"
          else
            echo "::notice::No Apple signing credentials; using ad-hoc signing without notarization"
            codesign --force --sign - build/ShellRS.app
          fi
          codesign --verify --deep --strict --verbose=2 build/ShellRS.app
          notarize() {
            xcrun notarytool submit "$1" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
              --wait --output-format json > "$RUNNER_TEMP/notary.json"
            cat "$RUNNER_TEMP/notary.json"
            # --wait returning is not success: the status has to say so.
            if [ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != Accepted ]; then
              xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
                --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
              exit 1
            fi
          }
          if $developer_id; then
            printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent build/ShellRS.app "$RUNNER_TEMP/notarize.zip"
            notarize "$RUNNER_TEMP/notarize.zip"
            xcrun stapler staple build/ShellRS.app
          fi
          # Keep the app's signature and any notarization ticket in the update zip.
          ditto -c -k --keepParent build/ShellRS.app "dist/ShellRS-$VERSION-macos-$ARCH.app.zip"
          # The first-install disk image, with the Applications shortcut.
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R build/ShellRS.app "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          dmg="dist/ShellRS-$VERSION-macos-$ARCH.dmg"
          # hdiutil's own estimate of the image size once came out too small
          # for the app ("No space left on device"), so the size is given,
          # with room to spare; the compressed image is about half the app.
          # It also fails now and then with "Resource busy" on the runners.
          df -h "$RUNNER_TEMP" .
          size=$(( $(du -sm "$RUNNER_TEMP/dmg" | cut -f1) * 2 + 20 ))
          for attempt in 1 2 3; do
            hdiutil create -volname ShellRS -srcfolder "$RUNNER_TEMP/dmg" -ov \
              -fs HFS+ -size "${size}m" -format UDZO "$dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          if $developer_id; then
            codesign --force --timestamp --sign "$IDENTITY" "$dmg"
            notarize "$dmg"
            xcrun stapler staple "$dmg"
            spctl -a -vv -t install "$dmg"
          fi
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/setup-nasm@v1
      - name: Build
        shell: bash
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bins
      - name: Runtime
        shell: pwsh
        run: ./scripts/windows-runtime.ps1 target/release
      - name: Installer
        shell: pwsh
        run: |
          # windows-2025 ships Inno Setup 6.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y; }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildDir=$env:GITHUB_WORKSPACE\target\release" `
            "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\shellrs.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable
        shell: pwsh
        run: |
          # The portable zip, also what a portable copy updates from: both
          # programs at its root beside an empty data folder, which is what
          # makes a copy portable. 7-Zip keeps the empty folder;
          # Compress-Archive would drop it.
          $folder = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path (Join-Path $folder "data") | Out-Null
          Copy-Item "target\release\shellrs.exe", "target\release\shellrs-cli.exe" $folder
          $zip = "$env:GITHUB_WORKSPACE\dist\ShellRS-$env:VERSION-windows-x86_64-portable.zip"
          Push-Location $folder
          7z a -tzip -mx=9 $zip shellrs.exe shellrs-cli.exe data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          # The first path listed is the archive itself.
          $entries = 7z l -slt $zip | Select-String '^Path = ' |
            ForEach-Object { $_.Line.Substring(7) } | Select-Object -Skip 1
          if (Compare-Object @($entries) @('data', 'shellrs-cli.exe', 'shellrs.exe')) {
            Write-Error "The portable zip holds: $($entries -join ', ')"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: verify
    # Built in Ubuntu 20.04 so the AppImage runs on its glibc (2.31) and
    # later: Ubuntu 20.04, Debian 11, and the newer ones (issue #28).
    # GitHub has no 20.04 runners any more, hence the container.
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      SHELLRS_UPDATE_CHANNEL: ${{ needs.verify.outputs.channel }}
      SHELLRS_COMMIT: ${{ github.sha }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git file \
            build-essential cmake clang pkg-config libfontconfig-dev \
            libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libdbus-1-dev libssl-dev
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      # Its own cache: build scripts compiled on a newer glibc do not run here.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-20.04
      - name: Build
        run: |
          export SHELLRS_BUILD_DATE=$(date -u +%Y-%m-%d)
          cargo build --release --locked --bin shellrs
      - name: Needs glibc 2.31 at most
        run: |
          needed=$(objdump -T target/release/shellrs | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "The binary needs $needed"
          test "$(printf '%s\n' "$needed" GLIBC_2.31 | sort -V | tail -1)" = GLIBC_2.31
      - name: AppImage
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          # No FUSE on the runner: let the tool unpack itself.
          export APPIMAGE_EXTRACT_AND_RUN=1
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            packaging/linux/appimage.sh target/release/shellrs "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, macos, windows, linux]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
      RELEASE_ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect packages
        run: |
          mkdir dist
          cp artifacts/macos-aarch64/* artifacts/macos-x86_64/* artifacts/windows/* artifacts/linux/* dist/
          cp artifacts/notes/notes.md notes.md
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Sign packages and update manifests
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::Set the MINISIGN_SECRET_KEY repository secret to the fork's minisign private key"
            exit 1
          fi
          umask 077
          export MINISIGN_KEY_FILE
          MINISIGN_KEY_FILE=$(mktemp "$RUNNER_TEMP/minisign.XXXXXX")
          trap 'rm -f "$MINISIGN_KEY_FILE"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$MINISIGN_KEY_FILE"
          unset MINISIGN_SECRET_KEY
          for package in dist/ShellRS-*; do
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$MINISIGN_KEY_FILE" \
              -m "$package" -t "shellrs $VERSION ${package##*/}"
            minisign -Vm "$package" -P "$SHELLRS_RELEASE_PUBLIC_KEY" -q
          done
          (cd dist && sha256sum ShellRS-* > SHA256SUMS)
          packaging/make-manifest.sh "$VERSION" beta notes.md dist dist/beta.json
          if [ "$CHANNEL" = stable ]; then
            packaging/make-manifest.sh "$VERSION" stable notes.md dist dist/stable.json
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ !github.event.created && !github.event.deleted }}
        run: |
          target=$(git ls-remote origin "$GITHUB_REF" "${GITHUB_REF}^{}" | awk '
            $2 ~ /\^\{\}$/ { peeled = $1; next }
            { direct = $1 }
            END { print (peeled ? peeled : direct) }
          ')
          if [ "$target" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The release tag moved while this run was building"
            exit 1
          fi
          flags=()
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          if [ "$REPUBLISH" = true ] && restricted=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq '.isDraft or .isImmutable'); then
            if [ "$restricted" != false ]; then
              echo "::error::Only a published, mutable release can be replaced"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" dist/ShellRS-* dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            # Clients fetch manifests first, so publish them after the new packages.
            gh release upload "$GITHUB_REF_NAME" dist/*.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ShellRS $VERSION" --notes-file notes.md "${flags[@]}"
          fi
